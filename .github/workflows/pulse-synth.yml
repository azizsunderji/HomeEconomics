name: Pulse Daily Synthesis & Email

# Runs Monday to Friday at 11:00 UTC (7:00am ET / 6:00am EST). News at Noon
# is a weekday product (owner decision 2026-09-04); the Monday run reads a
# 72-hour corpus window so weekend news is covered.
# Reads the pulse.db that the collection workflow synced to Dropbox,
# re-pulls Gmail to catch late newsletters, classifies, enriches paywalled
# articles via Browserbase, fetches journal abstracts, runs Sonnet synthesis,
# captures FT/NYT frontpage screenshots, and sends the email via Resend.
# Pushes the enriched DB back to Dropbox at the end.

on:
  schedule:
    # Three staggered attempts within 40 min — if GitHub's cron skips one
    # (which happens at top-of-hour under load), the next one catches it.
    # The "already-ran-today" guard below prevents double-sending.
    - cron: "0 11 * * 1-5"   # Mon–Fri 7:00am ET / 6:00am EST — primary
    - cron: "20 11 * * 1-5"  # Mon–Fri 7:20am ET — backup #1
    - cron: "40 11 * * 1-5"  # Mon–Fri 7:40am ET — backup #2 (last reasonable hit before 8am)
  workflow_dispatch:

jobs:
  synth:
    runs-on: ubuntu-latest
    # 60 -> 100 (29 Sep 2026): the production run takes about 50 minutes; the Opus 5.5
    # shadow step at the end (30 Sep - 2 Oct only) adds up to 35.
    timeout-minutes: 100
    env:
      # GitHub token for the idempotency guard (lookup of prior successful runs)
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
      GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
      GMAIL_TOKENS: ${{ secrets.GMAIL_TOKENS }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
      GMAIL_IMAP_PASSWORD: ${{ secrets.GMAIL_IMAP_PASSWORD }}
      DATA_LAKE_PATH: /tmp/data-lake
      DATA_LAKE_CATALOG_PATH: /tmp/reference/data_lake_catalog.md

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Idempotency guard: if today's run already succeeded OR is currently
      # in-progress (started earlier than this one), set should_run=false. All
      # subsequent steps are gated on this so backup cron triggers no-op
      # cleanly. The in-progress check matters because the primary 11:00 run
      # can still be running when the 11:20 backup starts (synth takes ~25 min).
      # Manual workflow_dispatch always runs (so we can force a re-send).
      - name: Check if today's briefing already sent or running
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — proceeding."
            exit 0
          fi
          TODAY_UTC=$(date -u +%Y-%m-%d)
          MY_ID=${{ github.run_id }}
          MY_STARTED=$(gh run view "$MY_ID" --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt)
          # Look at all recent runs of this workflow (success, failure, or in_progress).
          # Skip if there's a prior run today that is either:
          #   (a) already succeeded
          #   (b) still in-progress AND was created before us (it'll get there first)
          BLOCKERS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow="${{ github.workflow }}" \
            --limit 20 \
            --json databaseId,createdAt,status,conclusion \
            --jq "[.[] | select(.databaseId != $MY_ID) | select(.createdAt | startswith(\"$TODAY_UTC\")) | select(.conclusion == \"success\" or (.status == \"in_progress\" and .createdAt < \"$MY_STARTED\"))] | length")
          if [ "$BLOCKERS" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Today's briefing already sent OR an earlier run is in-progress ($BLOCKERS blocker(s)). Skipping."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No prior success or earlier-in-progress run today — proceeding."
          fi

      - name: "Corpus window (Monday covers the weekend, 72h; otherwise 24h)"
        # One number for the shell steps (enrichment) and the Python steps
        # (synthesis, v4b) via PULSE_LOOKBACK_HOURS. Same rule as
        # config.corpus_lookback_hours, evaluated in US Eastern.
        id: window
        if: steps.guard.outputs.should_run == 'true'
        run: |
          dow=$(TZ=America/New_York date +%u)
          if [ "$dow" = "1" ]; then hours=72; else hours=24; fi
          echo "hours=$hours" >> "$GITHUB_OUTPUT"
          echo "enrich_hours=$((hours + 12))" >> "$GITHUB_OUTPUT"
          echo "corpus window: ${hours}h (ET weekday $dow)"

      - name: Set up Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r pulse/requirements.txt
          # Playwright Chromium for Browserbase CDP (browser is remote — just need the Python client)
          python -m playwright install-deps chromium || true

      - name: Install rclone
        if: steps.guard.outputs.should_run == 'true'
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Configure rclone
        if: steps.guard.outputs.should_run == 'true'
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [dropbox]
          type = dropbox
          token = ${{ secrets.RCLONE_DROPBOX_TOKEN }}
          EOF

      - name: Pull Pulse DB + stamp files from Dropbox
        if: steps.guard.outputs.should_run == 'true'
        run: |
          mkdir -p pulse/data
          # Pull both pulse.db and the JSON stamp files (gmail_token_issued.json,
          # topic_weights.json) so health checks have the latest issuance dates
          # from the user's most-recent local re-auth.
          rclone copy "dropbox:Home Economics/Data/Pulse/" pulse/data/ \
            --include "pulse.db" --include "*.json" \
            --verbose --stats-one-line

      - name: Pull data lake for claim verification
        if: steps.guard.outputs.should_run == 'true'
        run: |
          mkdir -p /tmp/data-lake /tmp/reference
          rclone copy "dropbox:Home Economics/Data/Price/" /tmp/data-lake/Price/ \
            --include "*.parquet" --verbose --stats-one-line --transfers 4
          rclone copy "dropbox:Home Economics/Data/Redfin/" /tmp/data-lake/Redfin/ \
            --include "monthly_metro.parquet" --verbose --stats-one-line
          rclone copy "dropbox:Home Economics/Data/State_Migration/" /tmp/data-lake/State_Migration/ \
            --include "*.parquet" --verbose --stats-one-line
          rclone copy "dropbox:Home Economics/Data/PopulationEstimates/" /tmp/data-lake/PopulationEstimates/ \
            --include "*.parquet" --verbose --stats-one-line
          rclone copy "dropbox:Home Economics/Data/ACS_1Y/" /tmp/data-lake/ACS_1Y/ \
            --include "*.parquet" --verbose --stats-one-line --transfers 4
          rclone copy "dropbox:Home Economics/Data/GSS/" /tmp/data-lake/GSS/ \
            --include "*.parquet" --verbose --stats-one-line
          rclone copy "dropbox:Home Economics/Data/Crosswalks/" /tmp/data-lake/Crosswalks/ \
            --include "*.parquet" --verbose --stats-one-line
          rclone copy "dropbox:Home Economics/Data/Politics/" /tmp/data-lake/Politics/ \
            --include "*.parquet" --verbose --stats-one-line
          rclone copy "dropbox:Home Economics/Data/FHFA_NMDB/" /tmp/data-lake/FHFA_NMDB/ \
            --include "*.parquet" --verbose --stats-one-line
          rclone copy "dropbox:Home Economics/Reference/data_lake_catalog.md" /tmp/reference/ \
            --verbose --stats-one-line || true
          echo "=== Data lake size ===" && du -sh /tmp/data-lake/

      - name: Re-collect Gmail, RSS and Substack (items published after the morning collection)
        # The morning collection runs about 09:30 UTC and the brief is written at 11:00; WSJ,
        # Bloomberg and most newsletters publish in between (a WSJ essay published at 09:30 on
        # 24 Sep 2026 missed that day's brief by two minutes). Owner approved this step 24 Sep 2026.
        if: steps.guard.outputs.should_run == 'true'
        working-directory: pulse/scripts
        env:
          SUBSTACK_MIRROR_BASE: https://noon.homeeconomics.us/feeds
          FEED_MIRROR_BASE: https://noon.homeeconomics.us/feeds
          # Licensed feeds (gs_research.xml) sit under a secret path on the noon server.
          FEED_PRIVATE_BASE: https://noon.homeeconomics.us/private/${{ secrets.NOON_PRIVATE_TOKEN }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from store import get_db, bulk_upsert, log_collection_start, log_collection_end
          from collectors import gmail, rss_feeds, rss_substacks
          conn = get_db()
          for name, fn in (('gmail', gmail.collect), ('rss', lambda: rss_feeds.collect(max_age_hours=24)), ('substack', lambda: rss_substacks.collect(max_age_hours=24))):
              run_id = log_collection_start(conn, name)
              try:
                  items = fn()
                  new, dupe = bulk_upsert(conn, items)
                  log_collection_end(conn, run_id, len(items), new, dupe)
                  print(f'{name} re-collect: {new} new, {dupe} dupes (of {len(items)})')
              except Exception as e:
                  log_collection_end(conn, run_id, 0, 0, 0, error=str(e))
                  print(f'{name} re-collect failed: {e}')
          "

      - name: Classify unclassified items
        if: steps.guard.outputs.should_run == 'true'
        working-directory: pulse/scripts
        run: python run_pipeline.py classify-only

      - name: Enrich articles via Browserbase
        if: steps.guard.outputs.should_run == 'true'
        working-directory: pulse
        run: python enrich_articles.py --hours ${{ steps.window.outputs.enrich_hours }} --limit 300

      - name: Enrich t.co links inside high-relevance tweets
        if: steps.guard.outputs.should_run == 'true'
        working-directory: pulse
        run: python enrich_tweet_links.py --hours ${{ steps.window.outputs.hours }} --limit 60 --min-relevance 50 || echo "Tweet-link enrichment failed — continuing"

      - name: Fetch journal abstracts
        if: steps.guard.outputs.should_run == 'true'
        working-directory: pulse
        run: python fetch_journal_abstracts.py

      - name: Capture FT/NYT frontpage screenshots
        if: steps.guard.outputs.should_run == 'true'
        working-directory: pulse
        run: python capture_frontpages.py --no-upload || echo "Screenshots failed — continuing without"

      - name: Run synthesis (store v1 briefing as v3.1 scaffold; no v1 email)
        # Computes + stores the v1 briefing so v3.1 can reuse its News Themes /
        # paper / pulse scaffold, but --no-email suppresses the redundant v1
        # email. We now send only the v3.1 email. (v1 email retired 2026-06-30.)
        if: steps.guard.outputs.should_run == 'true'
        working-directory: pulse/scripts
        env:
          PULSE_LOOKBACK_HOURS: ${{ steps.window.outputs.hours }}
        run: python run_pipeline.py synthesize --no-email

      # V2 disabled 2026-06-16: user is not using v2 comparison output.
      # Code preserved (v2_runner.py + dependencies untouched) in case we
      # want to revive A/B comparison later. Re-enable by uncommenting.
      # - name: Run V2 clustering roundups + send comparison email
      #   if: steps.guard.outputs.should_run == 'true'
      #   working-directory: pulse/scripts
      #   env:
      #     PULSE_DB: ${{ github.workspace }}/pulse/data/pulse.db
      #   run: python v2_runner.py --max-roundups 5 --to aziz@home-economics.us || echo "V2 run failed — continuing without"

      - name: Run V3.1 hybrid roundups + send comparison email
        # v3.1 reads the v1 briefing the synthesis step just wrote and
        # sends a parallel email with two-stage Haiku sub-clustering +
        # Opus per-cluster writing + 6-day historical context. Failures
        # here MUST NOT take down the v1 send — wrap in `|| true`.
        # Skipped when the PULSE_PIPELINE repo variable is "v4b" (see next step).
        if: steps.guard.outputs.should_run == 'true' && vars.PULSE_PIPELINE != 'v4b'
        working-directory: pulse/scripts
        env:
          PULSE_DB: ${{ github.workspace }}/pulse/data/pulse.db
          # Subscriber-mode send: recipients come from Clerk
          # (public_metadata.pulseNewsletter.subscribed). If CLERK_SECRET_KEY
          # is missing or the fetch fails, the runner falls back to sending
          # only to aziz@home-economics.us (previous behavior).
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PULSE_UNSUB_SECRET: ${{ secrets.PULSE_UNSUB_SECRET }}
        run: python v3_1_runner.py || echo "V3.1 run failed — continuing without"

      - name: Run V4b unified brief (News at Noon) — store only; the droplet sends at 12:15 ET
        # Gated by the PULSE_PIPELINE repository variable:
        #   gh variable set PULSE_PIPELINE --body v4b   -> this step runs, v3.1 above is skipped
        #   gh variable set PULSE_PIPELINE --body v3_1  -> rollback: v3.1 runs, this is skipped
        # v4b reads the v1 briefing written by the synthesis step, like v3.1,
        # and writes its own briefing_type (daily_v4b_attach). --no-send: the
        # brief is stored and synced; the owner edits it in the News at Noon
        # editor on the droplet (pulse/editor/), which sends at 12:15 ET.
        # Rollback to the GH shadow send: replace --no-send with
        # --to aziz@home-economics.us. Failures MUST NOT take down the run.
        if: steps.guard.outputs.should_run == 'true' && vars.PULSE_PIPELINE == 'v4b'
        working-directory: pulse/scripts
        env:
          PULSE_DB: ${{ github.workspace }}/pulse/data/pulse.db
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PULSE_UNSUB_SECRET: ${{ secrets.PULSE_UNSUB_SECRET }}
          PULSE_LOOKBACK_HOURS: ${{ steps.window.outputs.hours }}
        # Owner, 29 Sep 2026: a failed V4b step fails the run (it used to be swallowed, so the
        # 29 Sep OpenAI-credits failure looked like a success and no brief was produced).
        run: python -u v4b_runner.py --no-send

      # v1 health-report step retired 2026-06-30 alongside the v1 email. The
      # v3.1 health report below runs the same upstream collectors/enrichment/
      # front-pages probes, so v1's was redundant once we stopped sending v1.

      - name: Send daily pipeline-health diagnostic email (v3.1)
        # Parallel health report focused on v3.1's hybrid synthesis pipeline:
        # corpus filter, embedding+clustering, US-housing check, sub-clustering,
        # coherence gate, historical context, per-cluster Opus writing.
        # Same upstream collectors/enrichment/front-pages probes as v1.
        if: steps.guard.outputs.should_run == 'true'
        working-directory: pulse/scripts
        env:
          PULSE_DB: ${{ github.workspace }}/pulse/data/pulse.db
          # Kept after stage 2.2b was removed (29 Sep 2026); no stage reads it now.
          NOON_PRIVATE_BASE: https://noon.homeeconomics.us/private/${{ secrets.NOON_PRIVATE_TOKEN }}
        run: python delivery/pipeline_health_report.py --variant v3 --to aziz@home-economics.us || echo "Health report (v3.1) failed — continuing without"

      - name: Push DB back to Dropbox
        # Run even on failure, but only if the guard let us proceed past the check.
        if: always() && steps.guard.outputs.should_run == 'true'
        run: |
          rclone copy pulse/data/ "dropbox:Home Economics/Data/Pulse/" \
            --include "pulse.db" --include "*.json" \
            --verbose --stats-one-line

      - name: "Shadow test: the brief written by Claude Opus 5.5 (30 Sep - 2 Oct 2026; email to Aziz only)"
        # Owner, 29 Sep 2026: three-edition Opus 5.5 shadow test, no subscriber impact.
        # Runs AFTER the production brief is written, stored and pushed, so the noon server
        # gets the production brief at the usual time. It re-runs the whole writer path with
        # PULSE_WRITER_MODEL=claude-opus-5-5: the v1 synthesis (--rewrite-v1-themes; its
        # themes replace the stored scaffold's, nothing stored as 'daily'), then v4b
        # (embeddings, clusters, gates, rewrites, standalone entries). The result is stored
        # as briefing_type daily_v4b_shadow_opus55 (editor/ingest.py reads only
        # daily_v4b_attach) and emailed to aziz@home-economics.us only, subject
        # "[SHADOW Opus 5.5] ...". Once per UTC day, on the first production run of each
        # test date: the daily run is the 11:00 UTC workflow_dispatch (GitHub's schedule fires
        # hours late and those runs are skipped by the guard), so the gate is on the date,
        # not on the event. Never fatal: continue-on-error, a step timeout, and `|| echo`.
        # Remove this step after 2 Oct 2026.
        if: success() && steps.guard.outputs.should_run == 'true' && vars.PULSE_PIPELINE == 'v4b'
        continue-on-error: true
        timeout-minutes: 35
        working-directory: pulse/scripts
        env:
          PULSE_DB: ${{ github.workspace }}/pulse/data/pulse.db
          PULSE_LOOKBACK_HOURS: ${{ steps.window.outputs.hours }}
          PULSE_WRITER_MODEL: claude-opus-5-5
        run: |
          case "$(date -u +%Y-%m-%d)" in
            never) ;;  # Aziz ended the Opus 5.5 shadow test on 30 Sep 2026: the 4.8 brief read better; to re-run, put UTC dates back here
            *) echo "Opus 5.5 shadow: $(date -u +%Y-%m-%d) is not a test date; skipping"; exit 0 ;;
          esac
          done_today=$(python -c "import os,sqlite3; print(sqlite3.connect(os.environ['PULSE_DB']).execute(\"SELECT COUNT(*) FROM briefings WHERE briefing_type='daily_v4b_shadow_opus55' AND date(created_at)=date('now')\").fetchone()[0])" || echo 0)
          if [ "$done_today" != "0" ]; then
            echo "Opus 5.5 shadow already ran today; skipping"; exit 0
          fi
          python -u v4b_runner.py --model claude-opus-5-5 --rewrite-v1-themes \
            --briefing-type daily_v4b_shadow_opus55 \
            --to aziz@home-economics.us --subject-prefix "[SHADOW Opus 5.5] " \
            || echo "Opus 5.5 shadow run failed; the production brief is unaffected"
          cd "$GITHUB_WORKSPACE"
          rclone copy pulse/data/ "dropbox:Home Economics/Data/Pulse/" \
            --include "pulse.db" --verbose --stats-one-line \
            || echo "shadow DB push failed; the shadow row is only in this runner"
